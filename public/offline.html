<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>오프라인</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb; color: #1f2937;
        font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; text-align: center; padding: 24px; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #6b7280; margin: 0 0 20px; }
      button { background: #1d4ed8; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 15px; }
    </style>
  </head>
  <body>
    <div>
      <img src="/icons/icon-192.png" alt="" />
      <h1>인터넷에 연결되어 있지 않습니다</h1>
      <p>영수증 OCR과 결재 상신은 온라인에서만 할 수 있어요.</p>
      <button onclick="location.reload()">다시 시도</button>
    </div>
  </body>
</html>
